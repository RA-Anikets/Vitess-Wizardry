apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: cmms-vitess
  region: us-east-1
  version: "1.35"

iam:
  withOIDC: true

vpc:
  id: vpc-057a98c9de05e9f47
  clusterEndpoints:
    publicAccess: false
    privateAccess: true
  subnets:
    private:
      us-east-1a:
        id: subnet-09517b4d963e3fe08
      us-east-1b:
        id: subnet-0812c27c28cee952c

cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator", "controllerManager", "scheduler"]

managedNodeGroups:
  - name: ng-spot
    amiFamily: AmazonLinux2023          # Linux (default)
    instanceTypes: ["t4g.medium"]    # Graviton/ARM
    spot: true                       # EC2 Spot instances
    privateNetworking: true
    enableDetailedMonitoring: false  # Disable EC2 detailed monitoring
    # Workload pattern: baseline 1, peak 2 (scheduled scaling handled outside eksctl)
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    # EBS storage for each node
    volumeSize: 64                  # 128 GB per node
    volumeType: gp3                  # Cheapest recommended SSD for nodes
    labels:
      workload: vitess
      capacity: spot
      arch: arm64
    taints:
      - key: "spot"
        value: "true"
        effect: "NoSchedule"
    iam:
      withAddonPolicies:
        ebs: true
        cloudWatch: true