apiVersion: planetscale.com/v2
kind: VitessCluster
metadata:
  name: cmms-vitess-cluster
  namespace: cmms
spec:
  backup:
    engine: xtrabackup
    locations:
      - s3:
          bucket: cmms-vitess-backups
          region: us-east-1
  images:
    vtctld: vitess/lite:v22.0.1
    vtadmin: vitess/vtadmin:v22.0.1
    vtgate: vitess/lite:v22.0.1
    vttablet: vitess/lite:v22.0.1
    vtbackup: vitess/lite:v22.0.1
    vtorc: vitess/lite:v22.0.1
    mysqld:
      mysql80Compatible: vitess/lite:v22.0.1
    mysqldExporter: prom/mysqld-exporter:v0.14.0
  cells: # cells are same as availability zones in the cloud provider
  - name: zone1
    gateway:
      extraFlags:
        enable-views: "true"
        # Connection pooling and limits
        mysql-server-pool-conn-read-buffers: "true"
        grpc_max_message_size: "67108864"  # 64MB max gRPC message
        # Connection handling for 100 connections
        mysql_tcp_version: "tcp"
        mysql_server_read_timeout: "28800s"
        mysql_server_write_timeout: "28800s"
        mysql_default_workload: "OLTP"
        # Query optimization
        normalize_queries: "true"
        enable_system_settings: "true"
        # Tablet connection settings
        grpc_initial_conn_window_size: "131072"  # 128KB
        healthcheck_timeout: "60s"
        srv_topo_timeout: "30s"
        gateway_initial_tablet_timeout: "30s"
        # Discovery and caching
        discovery_low_replication_lag: "30s"
        discovery_high_replication_lag_minimum_serving: "120s"
        # Buffer settings for connection handling
        buffer_size: "100"
        buffer_window: "10s"
        buffer_min_time_between_failovers: "20s"
      authentication:
        static:
          secret:
            name: cmms-config
            key: users.json
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1Gi
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - vitess-control-plane
  vitessDashboard:
    cells:
    - zone1
    extraFlags:
      security_policy: read-only
    replicas: 1
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
    tolerations:
      - key: "spot"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: workload-type
                  operator: In
                  values:
                    - vitess
  vtadmin:
    rbac:
      name: cmms-config
      key: rbac.yaml
    cells:
      - zone1
    apiAddresses:
      - http://localhost:15001
    replicas: 1
    readOnly: false
    apiResources:
      limits:
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
    webResources:
      limits:
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
    tolerations:
      - key: "spot"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: workload-type
                  operator: In
                  values:
                    - vitess
  keyspaces:
    - name: schShared
      durabilityPolicy: none
      turndownPolicy: Immediate
      vitessOrchestrator:
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
        extraFlags:
          instance-poll-time: 1s
      partitionings:
      - equal:
          parts: 1
          shardTemplate:
            databaseInitScriptSecret:
              name: cmms-config
              key: init_db.sql
            tabletPools:
            - cell: zone1
              type: replica
              replicas: 2
              vttablet:
                extraFlags:
                  enforce_strict_trans_tables: "false"
                  init_db_name_override: schShared
                  queryserver-enable-views: "true"
                  queryserver-config-transaction-timeout: "72000s"
                  queryserver-config-query-timeout: "30000s"
                  db_charset: utf8mb4
                resources:
                  limits:
                    memory: 256Mi
                  requests:
                    cpu: 100m
                    memory: 256Mi
              mysqld:
                resources:
                  limits:
                    memory: 1024Mi
                  requests:
                    cpu: 100m
                    memory: 512Mi
              dataVolumeClaimTemplate:
                storageClassName: vitess-gp3
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 10Gi
              tolerations:
                - key: "spot"
                  operator: "Equal"
                  value: "true"
                  effect: "NoSchedule"
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: workload-type
                            operator: In
                            values:
                              - vitess
    - name: schSharedLookup
      durabilityPolicy: none
      turndownPolicy: Immediate
      vitessOrchestrator:
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
        extraFlags:
          instance-poll-time: 1s
      partitionings:
      - equal:
          parts: 1
          shardTemplate:
            databaseInitScriptSecret:
              name: cmms-config
              key: init_db.sql
            tabletPools:
            - cell: zone1
              type: replica
              replicas: 2
              vttablet:
                extraFlags:
                  enforce_strict_trans_tables: "false"
                  init_db_name_override: schSharedLookup
                  queryserver-config-transaction-timeout: "72000s"
                  queryserver-config-query-timeout: "30000s"
                  db_charset: utf8mb4
                resources:
                  limits:
                    memory: 256Mi
                  requests:
                    cpu: 100m
                    memory: 256Mi
              mysqld:
                resources:
                  limits:
                    memory: 1024Mi
                  requests:
                    cpu: 100m
                    memory: 512Mi
              dataVolumeClaimTemplate:
                storageClassName: vitess-gp3
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 10Gi
              tolerations:
                - key: "spot"
                  operator: "Equal"
                  value: "true"
                  effect: "NoSchedule"
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: workload-type
                            operator: In
                            values:
                              - vitess
  updateStrategy:
    type: Immediate
---
apiVersion: v1
kind: Secret
metadata:
  name: cmms-config
  namespace: cmms
type: Opaque
stringData:
  users.json: |
    {
      "root":[{"Password": "Pass@Pune211008"}],
      "user1":[{"Password": "Pass@Pune211008"}],
      "usrAdmin":[{"Password": "uDrHNVvEhtBf"}],
      "usrTenant":[{"Password": "MlzHVOGCoXlG"}]
    }
  init_db.sql: |
    # This file is executed immediately after mysql_install_db,
    # to initialize a fresh data directory.

    ###############################################################################
    # Equivalent of mysql_secure_installation
    ###############################################################################
    # We need to ensure that super_read_only is disabled so that we can execute
    # these commands. Note that disabling it does NOT disable read_only.
    # We save the current value so that we only re-enable it at the end if it was
    # enabled before.
    SET @original_super_read_only=IF(@@global.super_read_only=1, 'ON', 'OFF');
    SET GLOBAL super_read_only='OFF';

    # Changes during the init db should not make it to the binlog.
    # They could potentially create errant transactions on replicas.
    SET sql_log_bin = 0;
    # Remove anonymous users & disable remote root access (only allow UNIX socket).
    DROP USER IF EXISTS ''@'%', ''@'localhost', 'root'@'%';

    # Remove test database.
    DROP DATABASE IF EXISTS test;

    ###############################################################################
    # Vitess defaults
    ###############################################################################

    # Admin user with all privileges.
    CREATE USER 'vt_dba'@'localhost';
    GRANT ALL ON *.* TO 'vt_dba'@'localhost';
    GRANT GRANT OPTION ON *.* TO 'vt_dba'@'localhost';
    GRANT PROXY ON ''@'' TO 'vt_dba'@'localhost' WITH GRANT OPTION;

    # User for app traffic, with global read-write access.
    CREATE USER 'vt_app'@'localhost';
    GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, RELOAD, PROCESS, FILE,
      REFERENCES, INDEX, ALTER, SHOW DATABASES, CREATE TEMPORARY TABLES,
      LOCK TABLES, EXECUTE, REPLICATION CLIENT, CREATE VIEW,
      SHOW VIEW, CREATE ROUTINE, ALTER ROUTINE, CREATE USER, EVENT, TRIGGER
      ON *.* TO 'vt_app'@'localhost';

    # User for app debug traffic, with global read access.
    CREATE USER 'vt_appdebug'@'localhost';
    GRANT SELECT, SHOW DATABASES, PROCESS ON *.* TO 'vt_appdebug'@'localhost';

    # User for administrative operations that need to be executed as non-SUPER.
    # Same permissions as vt_app here.
    CREATE USER 'vt_allprivs'@'localhost';
    GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, RELOAD, PROCESS, FILE,
      REFERENCES, INDEX, ALTER, SHOW DATABASES, CREATE TEMPORARY TABLES,
      LOCK TABLES, EXECUTE, REPLICATION SLAVE, REPLICATION CLIENT, CREATE VIEW,
      SHOW VIEW, CREATE ROUTINE, ALTER ROUTINE, CREATE USER, EVENT, TRIGGER
      ON *.* TO 'vt_allprivs'@'localhost';

    # User for slave replication connections.
    CREATE USER 'vt_repl'@'%';
    GRANT REPLICATION SLAVE ON *.* TO 'vt_repl'@'%';

    # User for Vitess VReplication (base vstreamers and vplayer).
    CREATE USER 'vt_filtered'@'localhost';
    GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, RELOAD, PROCESS, FILE,
      REFERENCES, INDEX, ALTER, SHOW DATABASES, CREATE TEMPORARY TABLES,
      LOCK TABLES, EXECUTE, REPLICATION SLAVE, REPLICATION CLIENT, CREATE VIEW,
      SHOW VIEW, CREATE ROUTINE, ALTER ROUTINE, CREATE USER, EVENT, TRIGGER
      ON *.* TO 'vt_filtered'@'localhost';

    # User for general MySQL monitoring.
    CREATE USER 'vt_monitoring'@'localhost';
    GRANT SELECT, PROCESS, SUPER, REPLICATION CLIENT, RELOAD
    ON *.* TO 'vt_monitoring'@'localhost';
    GRANT SELECT, UPDATE, DELETE, DROP
    ON performance_schema.* TO 'vt_monitoring'@'localhost';

    # custom sql is used to add custom scripts like creating users/passwords. We use it in our tests
    # {{custom_sql}}

    # We need to set super_read_only back to what it was before
    SET GLOBAL super_read_only=IFNULL(@original_super_read_only, 'ON');
  rbac.yaml: |
    rules:
    - resource: "*"
      actions:
        - "get"
        - "create"
        - "put"
        - "ping"
      subjects: ["*"]
      clusters: ["*"]
    - resource: "Shard"
      actions:
        - "emergency_failover_shard"
        - "planned_failover_shard"
      subjects: ["*"]
      clusters: ["*"]
