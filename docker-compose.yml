services:
  etcd:
    image: quay.io/coreos/etcd:${ETCD_VERSION}
    container_name: etcd # name of the container
    ports:
      - "2379:2379" # client url for other services to connect
      - "2380:2380" # peer url for clustering etcd nodes
    command: >
      etcd --name ${ETCD_NAME:-etcd0}
           --advertise-client-urls ${ETCD_ADVERTISE_CLIENT_URLS}
           --listen-client-urls ${ETCD_LISTEN_CLIENT_URLS}
           --listen-peer-urls ${ETCD_LISTEN_PEER_URLS}
           --data-dir ${ETCD_DATA_DIR}
           --auto-compaction-retention ${ETCD_AUTO_COMPACTION_RETENTION}
           --snapshot-count ${ETCD_SNAPSHOT_COUNT}
    volumes:
      - ./etcd-data:/etcd-data:rw
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3

  vtctld:
    image: vitess/lite:${VITESS_VERSION}
    platform: linux/amd64
    container_name: vtctld
    depends_on:
      - etcd
    command: >
      sh -c '
        echo "Waiting for etcd to be healthy...";
        until wget -qO- http://etcd:2379/health | grep -q "true"; do
          sleep 2;
        done;
        echo "etcd is healthy, starting vtctld...";
        exec /vt/bin/vtctld \
          --topo_implementation ${VTCTLD_TOPO_IMPL} \
          --topo_global_server_address ${VTCTLD_TOPO_GLOBAL_ADDR} \
          --topo_global_root ${VTCTLD_TOPO_GLOBAL_ROOT} \
          --cell ${VTCTLD_CELL} \
          --service_map ${VTCTLD_SERVICE_MAP} \
          --backup_storage_implementation ${VTCTLD_BACKUP_STORAGE_IMPL} \
          --file_backup_storage_root ${VTCTLD_FILE_BACKUP_ROOT} \
          --grpc_bind_address=0.0.0.0 \
          --port 15000 \
          --grpc_port 15999 \
          --logtostderr=${VTCTLD_LOGTOSTDERR}
      '
    ports:
      - "15000:15000"
      - "15999:15999"
    volumes:
      - ./vtctld-backups:/vt/vtdataroot/backups:rw
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://vtctld:15000/debug/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  vtctldclient:
    image: vitess/lite:${VITESS_VERSION}
    platform: linux/amd64
    container_name: vtctldclient
    depends_on:
      - vtctld
    command: >
      sh -c '
        /vt/bin/vtctldclient AddCellInfo --root ${VTCTLD_TOPO_GLOBAL_ROOT} --server vtctld:15999 --server-address etcd:2379 ${VTCTLD_CELL};
      '

  vttablet0:
    image: vitess/lite:${VITESS_VERSION}
    container_name: vttablet0
    platform: linux/amd64
    depends_on:
      - shard0
      - vtctldclient
    command: >
      sh -c '
        until /vt/bin/vtctldclient GetCellInfo --server vtctld:15999 ${VTCTLD_CELL}; do
          echo "Waiting for CellInfo..."
          sleep 2
        done
        echo "FOUND CellInfo..."
        exec /vt/bin/vttablet \
          --topo_implementation ${VTCTLD_TOPO_IMPL} \
          --topo_global_root ${VTCTLD_TOPO_GLOBAL_ROOT} \
          --topo_global_server_address etcd:2379 \
          --init_keyspace ${VTTABLET_KEYSPACE} \
          --init_shard ${VTTABLET_SHARD} \
          --tablet-path ${VTCTLD_CELL}-${VTTABLET_PATH} \
          --tablet_hostname=vttablet0 \
          --port 15100 \
          --grpc_port 16000 \
          --db_port 3306 \
          --db_app_user root \
          --db_app_password root \
          --db_host shard0 \
          --db-credentials-file=/vt/creds.json \
          --init_tablet_type ${VTTABLET_TABLET_TYPE} \
          --service_map ${VTTABLET_SERVICE_MAP}
        '
    ports:
      - "15100:15100"
      - "16000:16000"
    healthcheck:
      interval: 30s
      retries: 15
      test: ["CMD-SHELL", "curl -s --fail --show-error vttablet0:15100/debug/health"]
      timeout: 10s
    volumes:
      - ./creds.json:/vt/creds.json

  vttablet1:
    image: vitess/lite:${VITESS_VERSION}
    container_name: vttablet1
    platform: linux/amd64
    depends_on:
      - shard1
      - vtctldclient
    command: >
      sh -c '
        until /vt/bin/vtctldclient GetCellInfo --server vtctld:15999 ${VTCTLD_CELL}; do
          echo "Waiting for CellInfo..."
          sleep 2
        done
        echo "FOUND CellInfo..."
        exec /vt/bin/vttablet \
          --topo_implementation ${VTCTLD_TOPO_IMPL} \
          --topo_global_root ${VTCTLD_TOPO_GLOBAL_ROOT} \
          --topo_global_server_address etcd:2379 \
          --init_keyspace ${VTTABLET_KEYSPACE} \
          --init_shard ${VTTABLET_SHARD} \
          --tablet-path ${VTCTLD_CELL}-101 \
          --tablet_hostname=vttablet0 \
          --port 15100 \
          --grpc_port 16000 \
          --db_port 3306 \
          --db_app_user root \
          --db_app_password root \
          --db_host shard1 \
          --db-credentials-file=/vt/creds.json \
          --init_tablet_type ${VTTABLET_TABLET_TYPE} \
          --service_map ${VTTABLET_SERVICE_MAP}
        '
    ports:
      - "15200:15100"
      - "16100:16000"
    healthcheck:
      interval: 30s
      retries: 15
      test: ["CMD-SHELL", "curl -s --fail --show-error vttablet0:15200/debug/health"]
      timeout: 10s
    volumes:
      - ./creds.json:/vt/creds.json

  vtgate:
    image: vitess/lite:${VITESS_VERSION}
    platform: linux/amd64
    container_name: vtgate
    depends_on:
      - vtctld
    command: >
      sh -c '
        exec /vt/bin/vtgate \
          --topo_implementation=${VTCTLD_TOPO_IMPL} \
          --topo_global_server_address=etcd:2379 \
          --topo_global_root=${VTCTLD_TOPO_GLOBAL_ROOT} \
          --cell=${VTCTLD_CELL} \
          --cells_to_watch=${VTCTLD_CELL} \
          --tablet_types_to_wait=REPLICA,PRIMARY \
          --tablet_protocol=grpc \
          --port=15001 \
          --grpc_port=15991 \
          --mysql_server_port=15306 \
          --mysql_auth_server_impl=static \
          --mysql_auth_server_static_file=/vt/config/mysql_auth_server_static.json \
          --service_map=grpc-queryservice,grpc-tabletmanager,grpc-updatestream,grpc-vtgateservice \
          --logtostderr=true
      '
    ports:
      - "15002:15002"  # HTTP web UI
      - "15001:15001"  # gRPC port
      - "15306:15306"  # MySQL protocol
    volumes:
      - ./mysql_auth_server.json:/vt/config/mysql_auth_server_static.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:15001/debug/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  shard0:
    image: mysql:8.0.43
    command: --default-authentication-plugin=mysql_native_password --bind-address=0.0.0.0
    container_name: shard0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
      MYSQL_AUTH_PLUGIN: caching_sha2_password
    healthcheck:
      retries: 10
      test: ["CMD", "mysql", "-uroot", "-proot", "-e", "SHOW DATABASES;"]
      timeout: 10s
    ports:
      - "13316:3306"
    volumes:
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
  
  shard1:
    image: mysql:8.0.43
    command: --default-authentication-plugin=mysql_native_password --bind-address=0.0.0.0
    container_name: shard1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
      MYSQL_AUTH_PLUGIN: caching_sha2_password
    healthcheck:
      retries: 10
      test: ["CMD", "mysql", "-uroot", "-proot", "-e", "SHOW DATABASES;"]
      timeout: 10s
    ports:
      - "13326:3306"
    volumes:
      - ./my.cnf:/etc/mysql/conf.d/my.cnf

